<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic-Tac-Toe³ Admin · SCODE</title>
<style>
:root{--pink:#EC4899;--violet:#8B5CF6;--blue:#3B82F6;--ink:#1F1B2E;--grey:#6B6880;--bg:#F7F5FC;--soft:#EFE9FC;--line:#E2DAF6;--grad:linear-gradient(90deg,var(--pink),var(--violet),var(--blue))}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;border:0;cursor:pointer;border-radius:10px;padding:7px 12px;font-weight:700;background:#fff;box-shadow:0 1px 0 var(--line)}
button.pri{background:var(--grad);color:#fff}button.bad{background:#FDE7EF;color:#BE185D}button.small{padding:4px 9px;font-size:12.5px}
input,select{font:inherit;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.bubble{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.85),rgba(255,255,255,0) 42%),conic-gradient(from 200deg,var(--pink),var(--violet),var(--blue),#60A5FA,var(--pink));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.65),0 4px 14px rgba(139,92,246,.35);color:#fff;font-weight:900;font-size:12px}
#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:9;transition:opacity .5s}
#splash .bubble{width:120px;height:120px;font-size:46px;animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}}
header{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;box-shadow:0 1px 0 var(--line);position:sticky;top:0;z-index:2}
header h1{font-size:20px;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
header .sp{flex:1}
nav{display:flex;gap:6px}nav button.on{background:var(--ink);color:#fff}
main{max-width:1150px;margin:0 auto;padding:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(80,50,160,.06)}
.card b{display:block;font-size:26px;font-weight:900}.card span{color:var(--grey);font-size:13px;font-weight:700}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.1em;color:var(--violet);margin:18px 0 8px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 0 var(--line)}
th,td{text-align:left;padding:8px 10px;font-size:14px;border-bottom:1px solid var(--soft);vertical-align:middle}
th{font-size:12px;color:var(--grey);text-transform:uppercase;letter-spacing:.06em}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:800;background:var(--soft);color:var(--violet)}
.tag.red{background:#FDE7EF;color:#BE185D}.tag.green{background:#DCFCE7;color:#15803D}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.muted{color:var(--grey);font-size:13px}
#login{max-width:360px;margin:12vh auto;background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 30px rgba(80,50,160,.12);text-align:center}
#login h1{font-size:24px;margin:12px 0 4px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#login input{width:100%;margin:16px 0 10px}#login button{width:100%;padding:11px}
#err{color:#BE185D;font-weight:700;min-height:20px;font-size:14px}
.hidden{display:none!important}
footer{text-align:center;color:var(--grey);font-size:12.5px;font-weight:700;padding:24px;display:flex;justify-content:center;align-items:center;gap:7px}
footer .bubble{width:18px;height:18px;font-size:7px}
</style></head>
<body>
<div id="splash"><div class="bubble">SC</div></div>

<div id="login" class="hidden">
  <div class="bubble" style="width:54px;height:54px;font-size:20px">SC</div>
  <h1>Tic-Tac-Toe³ Admin</h1><p class="muted">Password is in admin-password.txt next to the server.</p>
  <input id="pw" type="password" placeholder="Admin password" autofocus>
  <button class="pri" id="loginBtn">Sign in</button><p id="err"></p>
</div>

<div id="app" class="hidden">
  <header><span class="bubble">SC</span><h1>Tic-Tac-Toe³ Admin</h1><span class="sp"></span>
    <nav><button data-tab="overview" class="on">Overview</button><button data-tab="players">Players</button><button data-tab="board">Leaderboard</button><button data-tab="mail">Emails</button></nav>
    <button id="logoutBtn">Sign out</button></header>
  <main>
    <section id="t-overview">
      <div class="cards" id="cards"></div>
      <h2>Live games</h2><table id="live"></table>
      <h2>Online now</h2><div id="online" class="row"></div>
      <h2>Waiting</h2><div id="waiting" class="muted"></div>
    </section>
    <section id="t-players" class="hidden">
      <div class="row"><input id="q" placeholder="Search name, email or ID" style="flex:1;min-width:220px"><button class="pri" id="searchBtn">Search</button></div>
      <table id="users"></table>
    </section>
    <section id="t-board" class="hidden">
      <div class="row"><select id="lbMode"><option value="1">Classic</option><option value="2">Ultimate</option><option value="3" selected>Cubed³</option></select>
        <select id="lbPeriod"><option value="day">Today</option><option value="week">This week</option><option value="month">This month</option><option value="all" selected>All-time</option></select></div>
      <table id="lb"></table>
    </section>
    <section id="t-mail" class="hidden"><div id="mailInfo" class="muted" style="margin-bottom:10px"></div><table id="mail"></table></section>
  </main>
  <footer><span class="bubble">SC</span>Powered by SCODE</footer>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MODES={1:"Classic",2:"Ultimate",3:"Cubed³"};
async function api(path,body){const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});
  if(r.status===401&&path!=="/login"){show(false);throw new Error("signed out")} return r.json();}
function who(u){return `<span class="who"><span class="av" style="background:${esc(u.colour)}22">${esc(u.avatar)}</span>${esc(u.name)} <span class="muted">#${u.id}</span></span>`}
function ago(ts){if(!ts)return"never";const s=Date.now()/1000-ts;return s<60?"just now":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"}
function dur(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m`}
function show(on){$("login").classList.toggle("hidden",on);$("app").classList.toggle("hidden",!on);if(on){refresh();}}
$("loginBtn").onclick=async()=>{const r=await api("/login",{password:$("pw").value});if(r.ok)show(true);else $("err").textContent=r.error};
$("pw").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()};
$("logoutBtn").onclick=async()=>{await api("/logout",{});show(false)};
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  for(const t of ["overview","players","board","mail"])$("t-"+t).classList.toggle("hidden",t!==b.dataset.tab);
  if(b.dataset.tab==="players")search();if(b.dataset.tab==="board")loadLB();refresh();});
let OV=null;
async function refresh(){
  try{OV=await api("/api/overview")}catch(e){return}
  const c=[["Uptime",dur(OV.uptime)],["Players online",OV.online.length],["Live games",OV.live.length],["Accounts",OV.accounts],["Games today",OV.games_today],
    ["Emails today",`${OV.emails_sent}/${OV.email_limit}`]];
  $("cards").innerHTML=c.map(([k,v])=>`<div class="card"><b>${v}</b><span>${k}</span></div>`).join("")+
    `<div class="card"><b style="font-size:16px">v${esc(OV.version)}</b><span>${OV.email_ready?'<span class="tag green">Email ready</span>':'<span class="tag red">No email-password.txt</span>'}</span></div>`;
  $("live").innerHTML=`<tr><th>Game</th><th>Mode</th><th>X</th><th>O</th><th>Moves</th><th>Turn</th><th></th></tr>`+
    (OV.live.map(g=>`<tr><td>#${g.id} ${g.rated?'<span class="tag">Ranked</span>':`<span class="tag green">Code ${esc(g.code)}</span>`}</td><td>${g.mode}</td><td>${who(g.x)}</td><td>${who(g.o)}</td><td>${g.moves}</td><td>${g.turn} · ${g.left}s</td>
      <td><button class="small bad" onclick="abortGame(${g.id})">Abort</button></td></tr>`).join("")||`<tr><td colspan="7" class="muted">No games right now.</td></tr>`);
  $("online").innerHTML=OV.online.map(u=>who(u)+(u.in_game?' <span class="tag">in game</span>':'')).join(" &nbsp; ")||'<span class="muted">Nobody online.</span>';
  const q=Object.entries(OV.queue).map(([m,l])=>`${m}: ${l.length?l.map(u=>esc(u.name)).join(", "):"—"}`).join(" · ");
  $("waiting").innerHTML=`Ranked queue → ${q}<br>Friend rooms → ${OV.rooms.map(r=>`${esc(r.code)} (${r.mode}, ${esc(r.host.name)})`).join(", ")||"—"}`;
  $("mailInfo").textContent=`${OV.emails_sent} of ${OV.email_limit} emails sent today.`;
  $("mail").innerHTML=`<tr><th>Time</th><th>To</th><th>Type</th><th>Status</th></tr>`+(OV.emails.map(e=>`<tr><td>${new Date(e.ts*1000).toLocaleTimeString()}</td><td>${esc(e.to_addr)}</td><td>${esc(e.purpose)}</td>
     <td>${e.ok?'<span class="tag green">sent</span>':'<span class="tag red">failed</span>'} <span class="muted">${esc(e.error||"")}</span></td></tr>`).join("")||`<tr><td colspan="4" class="muted">No emails yet today.</td></tr>`);
}
async function abortGame(id){if(confirm("End this game with no rating change?")){await api(`/api/games/${id}/abort`,{});refresh()}}
async function search(){const r=await api("/api/users?q="+encodeURIComponent($("q").value));
  $("users").innerHTML=`<tr><th>Player</th><th>Email</th><th>Ratings (C / U / ³)</th><th>Last seen</th><th>Status</th><th>Actions</th></tr>`+r.users.map(u=>{
    const rt=[1,2,3].map(m=>`${u.ratings[m].rating}<span class="muted">(${u.ratings[m].games})</span>`).join(" / ");
    return `<tr><td>${who(u)}</td><td>${esc(u.email)}</td><td>${rt}</td><td>${u.online?'<span class="tag green">online</span>':ago(u.last_seen)}</td>
    <td>${u.banned?`<span class="tag red">banned</span> <span class="muted">${esc(u.ban_reason||"")}</span>`:u.verified?'<span class="tag">active</span>':'<span class="tag">unverified</span>'}</td>
    <td class="row" style="margin:0">${u.banned?`<button class="small" onclick="act(${u.id},'unban')">Unban</button>`:`<button class="small bad" onclick="ban(${u.id})">Ban</button>`}
      <button class="small" onclick="rename(${u.id},'${esc(u.name)}')">Rename</button><button class="small" onclick="setRating(${u.id})">Set rating</button>
      <button class="small" onclick="if(confirm('Reset all stats and ratings for ${esc(u.name)}?'))act(${u.id},'reset_stats')">Reset stats</button>
      <button class="small bad" onclick="if(confirm('Delete ${esc(u.name)} forever?'))act(${u.id},'delete')">Delete</button></td></tr>`}).join("");}
async function act(id,what,body){await api(`/api/users/${id}/${what}`,body||{});search();refresh()}
function ban(id){const r=prompt("Reason for the ban (shown to the player):","Breaking the rules");if(r!==null)act(id,"ban",{reason:r})}
async function rename(id,old){const n=prompt("New name:",old);if(n){const r=await api(`/api/users/${id}/rename`,{name:n});if(!r.ok)alert(r.error);search()}}
function setRating(id){const m=prompt("Which mode? 1 = Classic, 2 = Ultimate, 3 = Cubed³","3");if(!m)return;const v=prompt("New rating:","1000");if(v)act(id,"rating",{mode:+m,rating:+v})}
$("searchBtn").onclick=search;$("q").onkeydown=e=>{if(e.key==="Enter")search()};
async function loadLB(){const r=await api(`/api/leaderboard?mode=${$("lbMode").value}&period=${$("lbPeriod").value}`);const all=$("lbPeriod").value==="all";
  $("lb").innerHTML=`<tr><th>#</th><th>Player</th><th>${all?"Rating":"Points gained"}</th><th>Rating</th><th>Tier</th><th>Games</th><th></th></tr>`+(r.rows.map((x,i)=>`<tr><td>${i+1}</td><td>${who(x)}</td><td><b>${x.score}</b></td><td>${x.rating}</td><td><span class="tag">${esc(x.tier)}</span></td><td>${x.games}</td>
    <td><button class="small" onclick="act(${x.id},'rating',{mode:${$("lbMode").value},rating:+prompt('New rating:','${x.rating}')}).then(loadLB)">Fix rating</button></td></tr>`).join("")||`<tr><td colspan="7" class="muted">Nobody here yet. All-time shows players with 10+ ranked games.</td></tr>`);}
$("lbMode").onchange=loadLB;$("lbPeriod").onchange=loadLB;
setInterval(()=>{if(!$("app").classList.contains("hidden"))refresh()},5000);
setTimeout(()=>{$("splash").style.opacity=0;setTimeout(()=>$("splash").remove(),500)},900);
fetch("/api/overview").then(r=>show(r.ok));
</script>
</body></html>
