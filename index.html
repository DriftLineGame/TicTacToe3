<style>
:root{
  --pink:#EC4899; --violet:#8B5CF6; --blue:#3B82F6; --ink:#1F1B2E; --grey:#6B6880; --bg:#F7F5FC; --soft:#EFE9FC; --line:#E2DAF6;
  --grad:linear-gradient(90deg,var(--pink),var(--violet),var(--blue));
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:"Fira Sans",-apple-system,system-ui,sans-serif;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:radial-gradient(120% 60% at 0% 0%,#FCE7F3 0,transparent 55%),radial-gradient(120% 60% at 100% 100%,#DBEAFE 0,transparent 55%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:none}
.screen.active{display:flex}

/* ---------- SCODE bubble ---------- */
.sc-bubble{position:relative;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.85),rgba(255,255,255,0) 42%),conic-gradient(from 200deg,var(--pink),var(--violet),var(--blue),#60A5FA,var(--pink));
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.65),inset 0 -6px 10px rgba(59,130,246,.35),0 4px 14px rgba(139,92,246,.35);flex:none}
.sc-bubble span{font-family:"Archivo Black",sans-serif;color:#fff;font-size:.42em;letter-spacing:-.04em;text-shadow:0 1px 2px rgba(80,40,140,.35),0 0 6px rgba(255,255,255,.6);font-size:9px}
.sc-bubble.big{width:150px;height:150px}
.sc-bubble.big span{font-size:62px;filter:blur(.3px)}

#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;align-content:center;gap:22px;transition:opacity .5s ease}
#splash .sc-bubble.big{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
#splash .word{font-family:"Archivo Black",sans-serif;font-size:34px;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .6s .45s both}
#splash.out{opacity:0;pointer-events:none}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}

/* ---------- home ---------- */
#home{overflow-y:auto;-webkit-overflow-scrolling:touch;justify-content:center}
.home-wrap{width:100%;max-width:460px;padding:calc(18px + var(--sat)) 18px calc(26px + var(--sab));display:flex;flex-direction:column;gap:12px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:6px}
.hero svg{width:84px;height:84px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(139,92,246,.3))}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.logo{font-family:"Archivo Black",sans-serif;font-size:clamp(34px,10.5vw,46px);line-height:1;margin-top:10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.01em}
.logo sup{font-size:.55em;color:var(--blue);-webkit-text-fill-color:var(--blue);vertical-align:.75em;margin-left:2px}
.tag{color:var(--grey);font-weight:500;font-size:15px;margin-top:8px}
.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);font-weight:800;margin-top:8px}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:12px 14px;text-align:left;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(80,50,160,.06);border:2px solid transparent;transition:transform .15s, border-color .2s}
.mode:active{transform:scale(.98)}
.mode.on{border-color:var(--violet);box-shadow:0 8px 26px rgba(139,92,246,.22)}
.mode .ico{width:54px;height:54px;flex:none;border-radius:14px;background:var(--soft);display:grid;place-items:center}
.mode b{display:block;font-size:18px;font-weight:800}
.mode span{display:block;color:var(--grey);font-size:14px;margin-top:2px}
.mode .chev{margin-left:auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.mode.on .chev{border:0;background:var(--grad)}
.mode.on .chev:after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.seg{display:flex;background:#fff;border-radius:16px;padding:5px;gap:5px;box-shadow:0 1px 0 var(--line)}
.seg button{flex:1;padding:12px 6px;border-radius:12px;font-weight:700;font-size:15px;color:var(--grey);transition:background .2s,color .2s}
.seg button.on{background:var(--ink);color:#fff}
.diffs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.diffs button{background:#fff;border-radius:14px;padding:10px 2px 9px;font-weight:800;font-size:13px;box-shadow:0 1px 0 var(--line);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:5px}
.diffs button i{display:flex;gap:2px}
.diffs button i em{width:6px;height:12px;border-radius:3px;background:var(--line)}
.diffs button.on{border-color:var(--c)}
.diffs button em.f{background:var(--c)}
.diff-desc{font-size:14px;color:var(--grey);min-height:20px;text-align:center}
.big-btn{margin-top:8px;background:var(--grad);color:#fff;font-family:"Archivo Black",sans-serif;font-size:22px;letter-spacing:.04em;padding:17px;border-radius:20px;box-shadow:0 10px 26px rgba(139,92,246,.35);transition:transform .12s}
.big-btn:active{transform:scale(.97)}
.continue{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:18px;padding:13px 16px;text-align:left}
.continue b{display:block;font-size:16px}
.continue span{display:block;font-size:13px;opacity:.7;margin-top:1px}
.continue .go{margin-left:auto;font-family:"Archivo Black";background:var(--grad);border-radius:12px;padding:8px 12px;font-size:14px}
.link-btn{color:var(--violet);font-weight:700;padding:8px;font-size:15px}
.brand{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--grey);font-size:13px;font-weight:700;margin-top:4px}
.brand .ver{font-weight:500;opacity:.7}

/* ---------- game ---------- */
#game{flex-direction:column;padding:var(--sat) 0 var(--sab)}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 10px 4px;height:52px;flex:none}
.icon-btn{width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:0 1px 0 var(--line);flex:none}
.icon-btn svg{width:21px;height:21px}
.gtitle{flex:1;text-align:center;line-height:1.05}
.gtitle b{display:block;font-family:"Archivo Black",sans-serif;font-size:19px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.gtitle span{font-size:11.5px;color:var(--grey);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hud{display:flex;gap:10px;padding:4px 12px 6px;align-items:stretch;flex:none}
#map{flex:none;border-radius:14px;background:#fff;box-shadow:0 1px 0 var(--line),0 6px 16px rgba(80,50,160,.08);touch-action:none}
.hud-info{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0}
.turn-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;padding:6px 13px 6px 7px;border-radius:99px;color:#fff;font-weight:800;font-size:15px;transition:background .3s}
.turn-pill .m{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-family:"Archivo Black";font-size:12px}
.turn-pill.thinking .dots:after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.status{font-size:15px;line-height:1.28;font-weight:500;color:var(--ink)}
.status b{font-weight:800}
.status .x{color:var(--pink)} .status .o{color:var(--blue)}
.maphint{font-size:11.5px;color:var(--grey);font-weight:600}
.worms{display:flex;gap:10px;font-size:12px;font-weight:800;color:var(--grey);align-items:center}
.worms .w{display:flex;align-items:center;gap:3px}
.worms svg{width:17px;height:17px}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:0 8px}
#board{touch-action:none;display:block}
.toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-20px);opacity:0;padding:9px 16px;border-radius:99px;color:#fff;font-weight:800;font-size:15px;white-space:nowrap;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.18);transition:opacity .25s, transform .35s cubic-bezier(.2,1.5,.4,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.actions{flex:none;padding:6px 12px 8px;display:flex;flex-direction:column;gap:8px}
.send-info{min-height:40px;border-radius:14px;background:#fff;padding:8px 12px;font-size:14.5px;line-height:1.25;display:flex;align-items:center;gap:9px;box-shadow:0 1px 0 var(--line);font-weight:500}
.send-info .arrow{flex:none;width:26px;height:26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px}
.send-info b{font-weight:800}
.send-info .win{color:#fff;background:var(--grad);border-radius:8px;padding:1px 7px;font-weight:800;font-size:13px;white-space:nowrap}
.btn-row{display:flex;gap:8px}
.confirm-btn{flex:1;height:56px;border-radius:18px;background:var(--grad);color:#fff;font-family:"Archivo Black",sans-serif;font-size:19px;letter-spacing:.04em;box-shadow:0 8px 20px rgba(139,92,246,.35);transition:opacity .2s,transform .12s,filter .2s}
.confirm-btn:disabled{opacity:.35;box-shadow:none;filter:grayscale(.4)}
.confirm-btn:not(:disabled):active{transform:scale(.97)}
.confirm-btn.ready{animation:ready 1.6s ease-in-out infinite}
@keyframes ready{50%{box-shadow:0 8px 30px rgba(236,72,153,.55)}}
.worm-btn{flex:none;height:56px;padding:0 14px;border-radius:18px;background:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;box-shadow:0 1px 0 var(--line);border:2px solid transparent;line-height:1.05;text-align:left}
.worm-btn svg{width:26px;height:26px;flex:none}
.worm-btn.armed{border-color:var(--violet);background:#F5F0FF;animation:ready 1.2s infinite}
.worm-btn:disabled{opacity:.35}
.gfoot{text-align:center;font-size:10.5px;color:var(--grey);font-weight:700;display:flex;justify-content:center;align-items:center;gap:5px;opacity:.85}
.gfoot .sc-bubble{width:14px;height:14px}.gfoot .sc-bubble span{font-size:6px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(31,27,46,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + var(--sab));animation:up .35s cubic-bezier(.2,1.1,.4,1) both}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet h2{font-family:"Archivo Black",sans-serif;font-size:28px;line-height:1.05}
.sheet h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);font-weight:800;margin:16px 0 6px}
.sheet p,.sheet li{font-size:15.5px;line-height:1.42;color:var(--ink)}
.sheet p{margin-bottom:8px}
.sheet ol{padding-left:22px}.sheet li{margin-bottom:6px}
.sheet .row{display:flex;gap:10px;margin-top:18px}
.sheet .row button{flex:1;padding:15px;border-radius:16px;font-weight:800;font-size:16px;background:#fff;box-shadow:0 1px 0 var(--line)}
.sheet .row button.pri{background:var(--grad);color:#fff;font-family:"Archivo Black";letter-spacing:.03em}
.end{text-align:center}
.end .big{font-family:"Archivo Black",sans-serif;font-size:46px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 8px}
.end .big.lose{background:none;color:var(--grey);-webkit-text-fill-color:var(--grey)}
.end .sub{color:var(--grey);font-weight:500;font-size:16px}
.end .medal{width:86px;height:86px;margin:2px auto 0;border-radius:50%;display:grid;place-items:center;font-family:"Archivo Black";font-size:44px;color:#fff;background:var(--grad);box-shadow:0 12px 30px rgba(139,92,246,.4);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.end .medal.lose{background:#B9B3CC;box-shadow:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
#hapl{position:fixed;left:-200px;top:0;opacity:0;pointer-events:none}
@media (max-height:640px){
  .topbar{height:44px;padding:4px 10px 2px}.icon-btn{width:36px;height:36px;border-radius:11px}
  .gtitle b{font-size:17px}.gtitle span{font-size:10.5px}
  .hud{padding:2px 12px 4px;gap:8px}.turn-pill{font-size:13.5px;padding:4px 11px 4px 5px}.turn-pill .m{width:19px;height:19px}
  .status{font-size:13.5px}.worms{font-size:11px}
  .actions{padding:4px 12px 4px;gap:6px}.send-info{min-height:34px;font-size:13px;padding:6px 10px}.send-info .arrow{width:22px;height:22px;font-size:13px}
  .confirm-btn,.worm-btn{height:48px}.confirm-btn{font-size:17px}.gfoot{font-size:9.5px}
}
@media (max-height:560px){ .gfoot{display:none} }

/* ---------- v2: face-to-face, fx, tutorial ---------- */
#game{isolation:isolate}
.tglow{position:absolute;inset:0;pointer-events:none;z-index:-1;opacity:0;transition:opacity .7s}
.tglow.x{background:radial-gradient(95% 42% at 50% 100%,rgba(236,72,153,.24),transparent 72%)}
.tglow.o{background:radial-gradient(95% 42% at 50% 100%,rgba(59,130,246,.24),transparent 72%)}
#game.face .tglow.o{background:radial-gradient(95% 40% at 50% 0%,rgba(59,130,246,.26),transparent 72%)}
.tglow.on{opacity:1}
.turn-pill.bump{animation:bump .55s cubic-bezier(.2,1.7,.4,1)}
@keyframes bump{0%{transform:scale(.6);opacity:.3}100%{transform:none;opacity:1}}
.ppanel{display:none;flex:none;padding:5px 10px;transition:opacity .35s}
#game.face .ppanel{display:block}
#game.face .hud,#game.face .actions{display:none}
.ppanel.top{transform:rotate(180deg)}
.pp{display:flex;gap:9px;align-items:stretch;background:#fff;border-radius:20px;padding:7px;box-shadow:0 1px 0 var(--line),0 6px 18px rgba(80,50,160,.08);border:2.5px solid transparent;transition:border-color .3s,box-shadow .3s}
.ppanel.active .pp{border-color:var(--pc);box-shadow:0 8px 26px var(--pcs)}
.ppanel.idle{opacity:.5}
.pmap{flex:none;border-radius:12px;background:var(--bg);touch-action:none}
.pp-col{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;justify-content:space-between}
.pp-status{font-size:13.5px;line-height:1.25;font-weight:500}
.pp-status b{font-weight:800}.pp-status .x{color:var(--pink)}.pp-status .o{color:var(--blue)}
.pp-status .who{display:inline-block;color:#fff;border-radius:99px;padding:0 8px;font-weight:800;margin-right:6px;font-size:12.5px;font-family:"Archivo Black"}
.pp-status .win{color:#fff;background:var(--grad);border-radius:7px;padding:0 6px;font-weight:800;font-size:11.5px;white-space:nowrap}
.pp-btns{display:flex;gap:6px}
.pp-btns .confirm-btn,.pp-btns .worm-btn{height:44px}
.pp-btns .confirm-btn{font-size:16px}
.pp-btns .worm-btn{padding:0 9px;font-size:12px}
.pp-btns .worm-btn svg{width:22px;height:22px}
.flipwrap{position:absolute;inset:0;pointer-events:none;transition:transform .3s}
.flipwrap.flip{transform:rotate(180deg)}
#game.face.oturn .toast{rotate:180deg}
.stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-family:"Archivo Black",sans-serif;color:#fff;font-size:clamp(28px,10vw,48px);padding:10px 24px;border-radius:20px;pointer-events:none;opacity:0;white-space:nowrap;box-shadow:0 16px 44px rgba(0,0,0,.28);letter-spacing:.03em;z-index:3;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.stamp:empty{display:none}
.stamp.go{animation:stamp 1.3s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.6) rotate(-16deg)}16%{opacity:1;transform:translate(-50%,-50%) scale(.9) rotate(-6deg)}26%{transform:translate(-50%,-50%) scale(1.06) rotate(-6deg)}36%{transform:translate(-50%,-50%) scale(1) rotate(-6deg)}78%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25) rotate(-6deg)}}
.stage.shake{animation:shake .4s}
.stage.shake-big{animation:shakeb .6s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
@keyframes shakeb{10%{transform:translate(-9px,4px) rotate(-.6deg)}25%{transform:translate(9px,-4px) rotate(.6deg)}40%{transform:translate(-7px,3px)}55%{transform:translate(6px,-2px)}70%{transform:translate(-4px,1px)}85%{transform:translate(2px,0)}}
.stage #board{transition:filter .6s}
.stage.sad #board{filter:grayscale(1) brightness(.92)}
.tut-card{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border-radius:18px;padding:11px 14px;text-align:left;box-shadow:0 1px 0 var(--line),0 6px 20px rgba(80,50,160,.06)}
.tut-card .play{width:42px;height:42px;flex:none;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:16px;padding-left:3px;box-shadow:0 6px 16px rgba(139,92,246,.35);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08)}}
.tut-card b{display:block;font-size:16px;font-weight:800}.tut-card span:not(.play){display:block;font-size:13px;color:var(--grey)}
.sheet video{width:100%;aspect-ratio:16/9;border-radius:16px;background:#000;margin-top:12px;display:block}
.floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floaters i{position:absolute;font-family:"Archivo Black";font-style:normal;opacity:.09;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-20vh) rotate(360deg)}}
.home-wrap{position:relative;z-index:1}
.big-btn{position:relative;overflow:hidden}
.big-btn:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.mode.on .ico{animation:wiggle .5s}
@keyframes wiggle{30%{transform:rotate(-8deg) scale(1.08)}60%{transform:rotate(6deg)}}
@media (min-width:700px){ .stage{padding:0 20px} }
</style>

<script>
// ===== Tic-Tac-Toe³ engine: rules + AI. Self-contained so it can run in a Web Worker. =====
function ENGINE() {
  const LN = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

  // L = 1 classic, 2 ultimate, 3 cubed.  Players: 1 = X, 2 = O, 3 = tie.
  // Cell index: L1 c | L2 b*9+c | L3 g*81+b*9+c.  Board index (bi): L2 b | L3 g*9+b.
  function create(L) {
    const n = L === 1 ? 9 : L === 2 ? 81 : 729, nb = L === 1 ? 1 : L === 2 ? 9 : 81;
    return { L, cells: new Uint8Array(n), bw: new Uint8Array(nb), cnt: new Uint8Array(nb), gw: new Uint8Array(9),
             target: -1, turn: 1, winner: 0, moves: 0, worm: [0, 3, 3], last: -1 };
  }
  function clone(s) {
    return { L: s.L, cells: s.cells.slice(), bw: s.bw.slice(), cnt: s.cnt.slice(), gw: s.gw.slice(),
             target: s.target, turn: s.turn, winner: s.winner, moves: s.moves, worm: s.worm.slice(), last: s.last };
  }
  function toJSON(s) {
    return { L: s.L, cells: Array.from(s.cells), bw: Array.from(s.bw), cnt: Array.from(s.cnt), gw: Array.from(s.gw),
             target: s.target, turn: s.turn, winner: s.winner, moves: s.moves, worm: s.worm.slice(), last: s.last };
  }
  function fromJSON(o) {
    return { L: o.L, cells: Uint8Array.from(o.cells), bw: Uint8Array.from(o.bw), cnt: Uint8Array.from(o.cnt), gw: Uint8Array.from(o.gw),
             target: o.target, turn: o.turn, winner: o.winner, moves: o.moves, worm: o.worm.slice(), last: o.last };
  }
  function line3(a, base, p) {
    for (let i = 0; i < 8; i++) { const l = LN[i]; if (a[base + l[0]] === p && a[base + l[1]] === p && a[base + l[2]] === p) return l; }
    return null;
  }
  function allSet(a, base) { for (let i = 0; i < 9; i++) if (!a[base + i]) return false; return true; }
  function boardOpen(s, bi) { return !s.bw[bi] && !(s.L === 3 && s.gw[(bi / 9) | 0]); }

  // Plays a move for s.turn. Returns events for the UI (what got won).
  function play(s, cell) {
    const p = s.turn; s.cells[cell] = p; s.moves++; s.last = cell;
    const ev = { board: -1, boardTie: -1, game: -1, gameTie: -1, line: null };
    if (s.L === 1) {
      const l = line3(s.cells, 0, p);
      if (l) { s.winner = p; ev.line = l; } else if (s.moves === 9) s.winner = 3;
      s.turn = 3 - p; return ev;
    }
    const bi = (cell / 9) | 0, c = cell % 9; s.cnt[bi]++;
    if (line3(s.cells, bi * 9, p)) { s.bw[bi] = p; ev.board = bi; }
    else if (s.cnt[bi] === 9) { s.bw[bi] = 3; ev.boardTie = bi; }
    if (s.L === 2) {
      if (s.bw[bi]) {
        const l = s.bw[bi] === p ? line3(s.bw, 0, p) : null;
        if (l) { s.winner = p; ev.line = l; } else if (allSet(s.bw, 0)) s.winner = 3;
      }
      s.target = c;
    } else {
      const g = (bi / 9) | 0, b = bi % 9;
      if (s.bw[bi]) {
        if (s.bw[bi] === p && line3(s.bw, g * 9, p)) { s.gw[g] = p; ev.game = g; }
        else if (allSet(s.bw, g * 9)) { s.gw[g] = 3; ev.gameTie = g; }
        if (s.gw[g]) {
          const l = s.gw[g] === p ? line3(s.gw, 0, p) : null;
          if (l) { s.winner = p; ev.line = l; } else if (allSet(s.gw, 0)) s.winner = 3;
        }
      }
      s.target = b * 9 + c;
    }
    s.turn = 3 - p; return ev;
  }

  // Where the player to move is allowed to go: {kind:'any'|'game'|'board', g, bi}
  function zone(s, worm) {
    if (s.L === 1) return { kind: 'board', bi: 0 };
    const t = s.target;
    if (worm || t < 0) return { kind: 'any' };
    if (s.L === 2) return s.bw[t] ? { kind: 'any' } : { kind: 'board', bi: t };
    const g = (t / 9) | 0;
    if (s.gw[g]) return { kind: 'any' };
    if (s.bw[t]) return { kind: 'game', g };
    return { kind: 'board', bi: t, g };
  }
  function legal(s, worm) {
    const out = []; if (s.winner) return out;
    if (s.L === 1) { for (let i = 0; i < 9; i++) if (!s.cells[i]) out.push(i); return out; }
    const z = zone(s, worm), nb = s.bw.length;
    for (let bi = 0; bi < nb; bi++) {
      if (!boardOpen(s, bi)) continue;
      if (z.kind === 'board' && bi !== z.bi) continue;
      if (z.kind === 'game' && ((bi / 9) | 0) !== z.g) continue;
      for (let c = 0; c < 9; c++) if (!s.cells[bi * 9 + c]) out.push(bi * 9 + c);
    }
    return out;
  }

  // Fast random move for playouts.
  function pickIn(s, bi) {
    let n = 0; const tmp = [];
    for (let c = 0; c < 9; c++) if (!s.cells[bi * 9 + c]) tmp[n++] = bi * 9 + c;
    return n ? tmp[(Math.random() * n) | 0] : -1;
  }
  function rnd(s) {
    if (s.L === 1) { const m = legal(s); return m[(Math.random() * m.length) | 0]; }
    const z = zone(s, false);
    if (z.kind === 'board') return pickIn(s, z.bi);
    if (z.kind === 'game') {
      for (let k = 0; k < 24; k++) { const bi = z.g * 9 + ((Math.random() * 9) | 0); if (!s.bw[bi]) { const c = pickIn(s, bi); if (c >= 0) return c; } }
    } else {
      const n = s.cells.length;
      for (let k = 0; k < 60; k++) { const cell = (Math.random() * n) | 0; if (!s.cells[cell] && boardOpen(s, (cell / 9) | 0)) return cell; }
    }
    const m = legal(s); return m[(Math.random() * m.length) | 0];
  }

  // ---------- AI ----------
  function minimax(s, me) {
    // Perfect play for classic. Returns {move, score}
    let best = null, bestScore = -1e9;
    const moves = legal(s);
    for (const m of moves) {
      const t = clone(s); play(t, m);
      const sc = -negamax(t, 1);
      if (sc > bestScore || (sc === bestScore && Math.random() < .35)) { bestScore = sc; best = m; }
    }
    return best;
  }
  function negamax(s, depth) {
    if (s.winner) return s.winner === 3 ? 0 : (s.winner === s.turn ? 10 - depth : -(10 - depth));
    let best = -1e9;
    for (const m of legal(s)) { const t = clone(s); play(t, m); const v = -negamax(t, depth + 1); if (v > best) best = v; }
    return best;
  }

  function immediate(s, moves) {
    // A move that wins the whole thing right now
    for (const m of moves) { const t = clone(s); play(t, m); if (t.winner === s.turn) return m; }
    return -1;
  }
  function canWinBoard(s, bi, p) {
    for (const l of LN) {
      let mine = 0, empty = -1, ok = true;
      for (const k of l) { const v = s.cells[bi * 9 + k]; if (v === p) mine++; else if (!v) empty = k; else ok = false; }
      if (ok && mine === 2 && empty >= 0) return true;
    }
    return false;
  }

  function heuristic(s, moves) {
    // Medium: greedy one-ply with sensible "where am I sending them" rules.
    const me = s.turn, op = 3 - me;
    let best = moves[0], bestSc = -1e9;
    for (const m of moves) {
      const t = clone(s); const ev = play(t, m);
      let sc = Math.random() * 6;
      if (t.winner === me) sc += 10000;
      if (ev.game >= 0) sc += 400;
      if (ev.board >= 0) sc += 90;
      // block: would the opponent have won this board with this square?
      if (s.L > 1) {

  else if (vsAI) { title = lose ? "AI WINS" : "YOU WIN!"; sub = lose ? `The ${DIFF_NAME[G.cfg.diff]} AI got you this time.` : `You beat the ${DIFF_NAME[G.cfg.diff]} AI${G.cfg.diff === 3 ? ". That's seriously impressive." : "!"}`; medal = w === 1 ? "X" : "O"; }
  else { title = `${w === 1 ? "X" : "O"} WINS!`; sub = `Three ${G.s.L === 1 ? "in a row" : G.s.L === 2 ? "boards in a row" : "games in a row"}. GG!`; medal = w === 1 ? "X" : "O"; }
  openSheet(`<div class="end"><div class="medal ${lose ? "lose" : ""}">${medal}</div><div class="big ${lose ? "lose" : ""}">${title}</div><p class="sub">${sub}</p>
    <div class="row"><button id="eHome">Menu</button><button id="eView">See board</button><button class="pri" id="eAgain">REMATCH</button></div></div>`);
  $("eHome").onclick = () => { closeSheet(); goHome(); };
  $("eView").onclick = () => closeSheet();
  $("eAgain").onclick = () => { closeSheet(); rematch(); };
}
function rematch() { startGame(G.cfg); }

// ======================= INPUT =======================
function boardTap(ev) {
  SFX.init();
  if (!G || G.busy) return;
  const s = G.s; if (s.winner || isAI(s.turn)) return;
  const rect = board.getBoundingClientRect(), x = ev.clientX - rect.left, y = ev.clientY - rect.top;
  let cell = -1;
  if (s.L === 1) { const gc = geoClassic(BS); for (let c = 0; c < 9; c++) { const r = gc.cell(c); if (x >= r[0] && x < r[0] + r[2] && y >= r[1] && y < r[1] + r[2]) cell = c; } }
  else {
    const gm = mainGeo(); let best = -1, bd = 1e9;
    for (let b = 0; b < 9; b++) for (let c = 0; c < 9; c++) {
      const r = gm.cell(b, c), cx = r[0] + r[2] / 2, cy = r[1] + r[2] / 2, d = Math.max(Math.abs(x - cx), Math.abs(y - cy));
      if (d < r[2] * .62 && d < bd) { bd = d; best = (s.L === 2 ? b * 9 : G.view * 81 + b * 9) + c; }
    }
    cell = best;
  }
  if (cell < 0) return;
  if (!G.legalSet.has(cell)) {
    if (!s.cells[cell]) { SFX.tap(); toast(s.L === 1 ? "Taken!" : "You can't play there right now", "#6B6880"); }
    return;
  }
  if (s.L === 1) return commit(cell);
  if (G.pending === cell) { confirmMove(); return; } // double tap = confirm
  setPending(cell); SFX.select(s.turn); SFX.whoosh(); haptic("light");
}
function confirmMove() {
  SFX.init();
  if (!G) return;
  if (G.s.winner) return rematch();
  if (G.pending < 0 || G.busy || isAI(G.s.turn)) return;
  commit(G.pending);
}
function mapTap(ev) { const rect = mapC.getBoundingClientRect(); mapTapAt(ev.clientX - rect.left, ev.clientY - rect.top, MS); }
function mapTapAt(x, y, M) {
  SFX.init(); if (!G || G.s.L !== 3) return;
  const mg = mapGeo(M);
  for (let g = 0; g < 9; g++) { const [gx, gy, T] = mg.game(g); if (x >= gx - 2 && x < gx + T + 2 && y >= gy - 2 && y < gy + T + 2) {
    if (g !== G.view) { setView(g); SFX.tap(); haptic(); if (G.pending >= 0 && (G.pending / 81 | 0) !== g) { /* keep pending, just look */ } } return; } }
}
board.addEventListener("pointerup", boardTap);
mapC.addEventListener("pointerup", mapTap);
$("confirmBtn").onclick = confirmMove;
function toggleWorm() {
  SFX.init(); if (!G || G.busy || G.s.winner || isAI(G.s.turn)) return; const p = G.s.turn; if (G.s.worm[p] <= 0) return;
  G.worm = !G.worm; setPending(-1); refreshLegal();
  if (G.worm) { SFX.wormhole(); haptic("heavy"); toast("Wormhole open: play anywhere!", "#8B5CF6"); const c = boardPt([BS / 2, BS / 2]); vortex(c[0], c[1]); } else SFX.tap();
  autoView(); updateHUD();
}
$("wormBtn").onclick = toggleWorm;
$("faceBtn").onclick = () => {
  SFX.init(); if (!G || G.cfg.opp !== "pass") return;
  G.cfg.face = !G.cfg.face; prefs.face = G.cfg.face; savePrefs(); save(); SFX.whoosh();
  layout(); requestAnimationFrame(() => { layout(); updateHUD(); });
  toast(G.cfg.face ? "Face to face: O sits at the top" : "Same-side layout", "#8B5CF6");
};
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("pointerdown", e => { if (e.target.closest("button")) haptic("light"); }, true);
board.addEventListener("pointerdown", () => { if (G && !G.busy && !G.s.winner && !isAI(G.s.turn)) haptic("light"); });

// ======================= SCREENS =======================
function show(id) { for (const s of document.querySelectorAll(".screen")) s.classList.toggle("active", s.id === id); }
function startGame(cfg, saved) {
  newGame(cfg, saved);
  if (!saved) save();
  $("gTitle").textContent = MODE_NAME[cfg.L];
  $("gSub").textContent = cfg.opp === "ai" ? `vs AI · ${DIFF_NAME[cfg.diff]}` : "Pass & Play";
  show("game"); $("game").classList.toggle("face", isFace());
  requestAnimationFrame(() => { layout(); autoView(); G.viewT = -1e9; G.startT = now(); updateHUD(); maybeAI(); });
}
function goHome() { G = null; workerCb = null; if (worker) { worker.terminate(); makeWorker(); } refreshHome(); show("home"); }
$("homeBtn").onclick = () => { SFX.init(); SFX.tap(); goHome(); };

function openSheet(html) { $("sheet").innerHTML = html; $("modal").classList.remove("hidden"); }
function closeSheet() { const v = $("tutVid"); if (v) v.pause(); $("modal").classList.add("hidden"); }
function showTutorial() {
  openSheet(`<h2>Video tutorial</h2><p style="color:var(--grey);margin-top:6px">Three minutes: tic-tac-toe → Ultimate → Cubed³, with pause-and-guess moments. Turn your phone sideways or tap full screen for the best view.</p>
    <video id="tutVid" src="tutorial.mp4" poster="tutorial-poster.jpg" controls playsinline preload="metadata"></video>
    <div class="row"><button class="pri" id="tOk">DONE</button></div>`);
  $("tOk").onclick = closeSheet;
  const v = $("tutVid"); v.play().catch(() => {});
}
$("modal").addEventListener("click", e => { if (e.target.id === "modal" && !(G && G.over && false)) closeSheet(); });

function soundIcon() {
  $("soundBtn").innerHTML = prefs.sound
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="#1F1B2E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="#9A94AE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>`;
}
$("soundBtn").onclick = () => { prefs.sound = !prefs.sound; SFX.on = prefs.sound; savePrefs(); soundIcon(); SFX.init(); SFX.tap(); };

// ---- rules
const RULES = {
  1: `<h2>Classic</h2><p>The one you know. Take turns placing <b>X</b> and <b>O</b>. Get three in a row (across, down or diagonal) to win.</p>
      <h3>Tip</h3><p>On Extreme the AI plays perfectly. The best you can do is a tie!</p>`,
  2: `<h2>Ultimate</h2><p>Nine small boards make one big game.</p>
      <h3>The Send</h3><p>The <b>square</b> you pick decides which <b>board</b> your opponent plays in next. Top-right square → top-right board.</p>
      <h3>Winning</h3><ol><li>Three in a row inside a board wins that board.</li><li>Win three boards in a row to win the game.</li></ol>
      <h3>Free moves</h3><p>If you're sent to a board that's already won or full, you can play in <b>any open board</b>.</p>
      <h3>In this app</h3><p>Tap a square to <b>preview</b>: a line shows where it sends your opponent. Tap <b>Confirm</b> (or tap the square again) to lock it in.</p>`,
  3: `<h2>Cubed³</h2><p>Nine Ultimate games on one sheet: 729 squares.</p>
      <h3>The Send, one level up</h3><p>Your <b>board's position</b> picks your opponent's <b>game</b>. Your <b>square's position</b> picks their <b>board</b>.</p>
      <p>Example: you play the centre board, bottom-right square → they go to the centre game, bottom-right board.</p>
      <h3>Winning</h3><ol><li>Three squares in a row wins a board.</li><li>Three boards in a row wins a game.</li><li>Three games in a row wins the match.</li></ol>
      <h3>Closed doors</h3><p>Sent to a finished board? Play any open board in that game. Sent to a finished game? Play <b>anywhere</b>.</p>
      <h3>Wormholes</h3><p>Each player gets 3. Tap <b>Wormhole</b> to ignore the Send and play any open square. Your move still sends your opponent like normal.</p>
      <h3>In this app</h3><p>The big board is the game you're sent to. The <b>map</b> shows the whole sheet; tap it to look at other games. Tap a square to preview the send line, then <b>Confirm</b>.</p>`,
};
function showRules(L) {
  const tut = L > 1 ? `<button class="tut-card" id="rTut" style="margin:0 0 14px"><span class="play">▶</span><div><b>Watch the video tutorial</b><span>3 min · Ultimate &amp; Cubed³</span></div></button>` : "";
  openSheet(tut + RULES[L] + `<div class="row"><button class="pri" id="rOk">GOT IT</button></div>`); $("rOk").onclick = closeSheet;
  if (L > 1) $("rTut").onclick = () => { SFX.tap(); showTutorial(); };
}
$("rulesBtn").onclick = () => { SFX.init(); showRules(prefs.L); };
function vibeLabel() { $("vibeBtn").textContent = prefs.vibe ? "Vibration: MAX · tap to test" : "Vibration: off"; }
$("vibeBtn").onclick = () => { prefs.vibe = !prefs.vibe; savePrefs(); vibeLabel(); if (prefs.vibe) haptic("max"); };
vibeLabel();
$("rulesBtn2").onclick = () => { SFX.init(); if (G) showRules(G.s.L); };

// ---- home controls
function refreshHome() {
  for (const b of document.querySelectorAll("#modes .mode")) b.classList.toggle("on", +b.dataset.l === prefs.L);
  for (const b of document.querySelectorAll("#oppSeg button")) b.classList.toggle("on", b.dataset.v === prefs.opp);
  for (const b of document.querySelectorAll("#diffs button")) b.classList.toggle("on", +b.dataset.d === prefs.diff);
  for (const b of document.querySelectorAll("#sideSeg button")) b.classList.toggle("on", +b.dataset.v === prefs.side);
  $("aiOpts").classList.toggle("hidden", prefs.opp !== "ai");
  $("layoutRow").classList.toggle("hidden", prefs.opp !== "pass");
  for (const b of document.querySelectorAll("#layoutSeg button")) b.classList.toggle("on", (b.dataset.v === "face") === !!prefs.face);
  $("diffDesc").textContent = DIFF_DESC[prefs.diff];
  $("rulesBtn").textContent = `How to play ${MODE_NAME[prefs.L]}`;
  const sv = loadSave();
  $("continueBtn").classList.toggle("hidden", !sv);
  if (sv) $("contSub").textContent = `${MODE_NAME[sv.cfg.L]} · ${sv.cfg.opp === "ai" ? "vs AI " + DIFF_NAME[sv.cfg.diff] : "Pass & Play"} · move ${sv.s.moves + 1}`;
}
document.querySelectorAll("#modes .mode").forEach(b => b.onclick = () => { SFX.init(); SFX.tap(); haptic(); prefs.L = +b.dataset.l; savePrefs(); refreshHome(); });
document.querySelectorAll("#oppSeg button").forEach(b => b.onclick = () => { SFX.init(); SFX.tap(); prefs.opp = b.dataset.v; savePrefs(); refreshHome(); });
document.querySelectorAll("#diffs button").forEach(b => b.onclick = () => { SFX.init(); SFX.tap(); haptic(); prefs.diff = +b.dataset.d; savePrefs(); refreshHome(); });
document.querySelectorAll("#layoutSeg button").forEach(b => b.onclick = () => { SFX.init(); SFX.tap(); prefs.face = b.dataset.v === "face"; savePrefs(); refreshHome(); });
$("tutBtn").onclick = () => { SFX.init(); SFX.tap(); showTutorial(); };
document.querySelectorAll("#sideSeg button").forEach(b => b.onclick = () => { SFX.init(); SFX.tap(); prefs.side = +b.dataset.v; savePrefs(); refreshHome(); });
$("playBtn").onclick = () => {
  SFX.init(); SFX.select(1); haptic();
  startGame({ L: prefs.L, opp: prefs.opp, diff: prefs.diff, human: prefs.opp === "ai" ? prefs.side : 1, face: prefs.opp === "pass" && !!prefs.face });
};
$("continueBtn").onclick = () => { SFX.init(); SFX.tap(); const sv = loadSave(); if (sv) startGame(sv.cfg, sv); };

// ---- boot
buildPanels(); soundIcon(); refreshHome(); makeWorker(); sizeCanvas(fx, fxctx, window.innerWidth, window.innerHeight); requestAnimationFrame(loop);
setTimeout(() => $("splash").classList.add("out"), 1500);
setTimeout(() => $("splash").remove(), 2100);
window.__ttt = { get G() { return G; }, E, startGame, commit, setPending, confirmMove };

</script>
